# FedAT baseline — Base Setting
# 6 clients, 3 language groups, XLM-RoBERTa-Base
# Full model weight exchange (1060.66 MB per round)

clients:
  type: simple
  total_clients: 6
  per_round: 6
  do_test: true
  speed_simulation: true
  simulation_distribution:
    distribution: uniform
    low: 1
    high: 240
  max_sleep_time: 240
  random_seed: 1

server:
  address: 127.0.0.1
  port: 8102
  staleness_bound: 1000
  synchronous: false
  simulate_wall_time: false
  do_test: false
  num_groups: 3
  minimum_clients_aggregated: 2
  periodic_interval: 20
  checkpoint_path: ./checkpoints/fedat/base
  model_path: ./models/fedat/base

data:
  datasource: mlfd
  dataset_name: xglue
  dataset_config: xnli
  label_list: contradiction, neutral, entailment
  lang_list: ar, bg, de, el, es, fr, hi, ru, sw, th, tr, ur, vi, zh, en
  partition_size: 1000
  sampler: iid
  random_seed: 9000

trainer:
  type: mlfd
  rounds: 400
  max_concurrency: 12
  target_accuracy: 0.99
  model_name: xlm-roberta-base
  max_seq_len: 128
  epochs: 1
  batch_size: 4
  optimizer: AdamW
  reg_alpha: 0.0    # No KD in FedAT

algorithm:
  type: fedavg

parameters:
  optimizer:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.01

results:
  result_path: ./results/fedat_base/
  types: round, elapsed_time, accuracy
